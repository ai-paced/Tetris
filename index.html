<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07354c"><meta name="description" content="Tetris Beach Edition der Klasse 5D – mit Touchscreen und Tastatur spielen."><title>Tetris · Beach Edition · 5D</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2307354c' d='M0 0h32v32H0z'/%3E%3Cpath fill='%2337dcff' d='M2 8h8v8H2zm10 0h8v8h-8zm10 0h8v8h-8zM12 18h8v8h-8z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link id="mobile-style" rel="stylesheet" href="mobile.css" media="(max-width:1000px) and (max-height:600px), (max-width:700px)"></head>
<body><main id="stage" aria-label="Tetris Beach Edition"><img class="background" src="beach.png" alt="Tetris Beach Edition: Strand bei Sonnenuntergang, ein Spiel von der 5D" draggable="false"><div id="playfield"><canvas id="board" width="472" height="840" aria-label="Tetris-Spielfeld mit 10 Spalten und 20 Reihen"></canvas></div>
<aside id="sidebar" aria-label="Spielinformationen und Steuerung">
<header class="mobile-title">TETRIS <span>BEACH EDITION · 5D</span></header>
<div class="previews"><div class="preview active-preview"><span class="mobile-label">Aktiver Block</span><canvas id="active" width="172" height="142" aria-label="Aktiver Block"></canvas></div><div class="preview next-preview"><span class="mobile-label">Nächster Block</span><canvas id="next" width="220" height="138" aria-label="Nächster Block"></canvas></div></div>
<div class="stats"><div class="stat score-stat"><span class="mobile-label">Punkte</span><output id="score" aria-label="Punkte">0</output></div><div class="stat level-stat"><span class="mobile-label">Level</span><output id="level" aria-label="Level">1</output></div><div class="stat lines-stat"><span class="mobile-label">Reihen</span><output id="lines" aria-label="Entfernte Reihen">0</output></div></div>
<div class="controls">
<button class="control left" data-action="left" aria-label="Nach links bewegen"><span>←</span></button><button class="control right" data-action="right" aria-label="Nach rechts bewegen"><span>→</span></button><button class="control rotate" data-action="rotate" aria-label="Block gegen den Uhrzeigersinn drehen"><span>↶ <small>Drehen</small></span></button><button class="control down" data-action="down" aria-label="Sanft fallen lassen"><span>↓ <small>Sinken</small></span></button><button class="control drop" data-action="drop" aria-label="Sofort fallen lassen"><span>⇊ <small>Ablegen</small></span></button><button class="control pause" data-action="pause" aria-label="Pause oder weiterspielen"><span>Ⅱ <small>Pause</small></span></button>
</div></aside>
<section id="overlay" aria-live="polite"><div class="dialog"><span class="eyebrow">BEACH EDITION · 5D</span><h1 id="heading">Bereit für<br>die nächste Welle?</h1><p id="message">Volle Reihen sammeln.<br>Mit Touch oder Pfeiltasten spielen.</p><button id="start">Spiel starten <span>→</span></button><button id="restart" hidden>Neu starten</button><p class="hint">↑ Drehen · ↓ Sinken · Leertaste Ablegen<br>P Pause</p></div></section>
<button id="fullscreen" aria-label="Vollbild umschalten">⛶ <span>Vollbild</span></button><div id="status" class="sr-only" role="status"></div></main><script src="engine.js"></script><script src="game.js"></script></body></html>
